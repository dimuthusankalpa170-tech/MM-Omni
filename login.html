<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MM Omni | Business Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
    <style>
        :root { --primary: #007bff; --bg: #0b111a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(rgba(11, 17, 26, 0.9), rgba(11, 17, 26, 0.9)), 
                        url('https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&q=80&w=2000') center/cover no-repeat;
            height: 100vh; display: flex; align-items: center; justify-content: center; color: white;
        }
        .portal-card {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
            padding: 50px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 480px; width: 90%; text-align: center;
        }
        .logo h1 { font-size: 2.8rem; letter-spacing: 1px; }
        .logo span { color: var(--primary); }
        .tagline { color: #888; margin-bottom: 40px; }
        .btn-group { display: flex; flex-direction: column; gap: 20px; }
        .portal-btn {
            display: flex; align-items: center; justify-content: center; padding: 18px; border-radius: 12px;
            text-decoration: none; color: white; font-weight: 600; transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05);
        }
        .portal-btn:hover { background: var(--primary); transform: translateY(-3px); }
        .portal-btn i { margin-right: 15px; }
    </style>
</head>
<body>
    <div class="portal-card">
        <div class="logo"><h1>MM <span>OMNI</span></h1><p class="tagline">Professional Service Network</p></div>
        <div class="btn-group">
            <a href="index.html#technicians" class="portal-btn"><i class="fas fa-user-tie"></i> Continue as Customer</a>
            <a href="index.html#register" class="portal-btn"><i class="fas fa-tools"></i> Join as Technician</a>
        </div>
    </div>
</body>
</html>
