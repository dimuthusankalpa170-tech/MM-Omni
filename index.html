<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MM OMNI | Professional Service Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
    <style>
        :root { --primary: #007bff; --dark: #0b111a; --success: #28a745; --danger: #dc3545; }
        body { background: var(--dark); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; }
        
        /* Navigation */
        nav { background: #000; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.5rem; font-weight: bold; color: white; letter-spacing: 1px; }
        .logo span { color: var(--primary); }

        /* Layout */
        .container { max-width: 1000px; margin: 20px auto; padding: 20px; }
        .card { background: #16202c; padding: 25px; border-radius: 15px; border: 1px solid #333; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .hidden { display: none; }

        /* UI Elements */
        .btn { padding: 12px 20px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; text-decoration: none; display: inline-block; text-align: center; font-size: 0.9rem; }
        .btn-primary { background: var(--primary); color: white; width: 100%; }
        .btn-success { background: var(--success); color: white; width: 100%; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-outline { background: transparent; border: 1px solid #444; color: white; }
        .btn:hover { opacity: 0.8; }
        
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; background: #0b111a; border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        .badge { font-size: 0.7rem; font-weight: bold; color: var(--success); text-transform: uppercase; margin-bottom: 5px; display: block; }
        label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #888; }
    </style>
</head>
<body>

<nav>
    <div class="logo">MM <span>OMNI</span></div>
    <div id="navButtons">
        <button class="btn btn-outline" onclick="showView('auth')">Technician Login</button>
    </div>
</nav>

<div class="container">
    
    <div id="view-customer">
        <h2 style="margin-bottom: 10px;">Find Professional Technicians</h2>
        <p style="color: #888; margin-bottom: 30px;">Direct access to verified experts in your area.</p>
        <div id="techList" class="grid">Searching for active specialists...</div>
    </div>

    <div id="view-auth" class="hidden">
        <div class="card" style="max-width: 400px; margin: 0 auto;">
            <h2 id="authTitle" style="text-align:center;">Technician Login</h2>
            <div style="margin-top:20px;">
                <input type="email" id="email" placeholder="Email Address">
                <input type="password" id="password" placeholder="Password">
                <button class="btn btn-primary" onclick="handleAuth()" id="authBtn">Login</button>
                <p id="toggleText" style="text-align:center; margin-top:20px; cursor:pointer; color:var(--primary);" onclick="toggleAuth()">Don't have an account? Register here</p>
                <button class="btn btn-outline" style="width:100%; margin-top:10px;" onclick="showView('customer')">Back to Home</button>
            </div>
        </div>
    </div>

    <div id="view-dashboard" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2>Technician Dashboard</h2>
            <button class="btn btn-danger" onclick="handleLogout()">Logout</button>
        </div>
        
        <div class="card">
            <h3>Profile Settings</h3>
            <label>Business / Profile Name</label>
            <input type="text" id="dbName" placeholder="e.g. Kalpa Repairs">
            <label>Contact Number</label>
            <input type="tel" id="dbPhone" placeholder="07X XXXXXXX">
            <label>Service Category</label>
            <select id="dbCat">
                <option value="Automobile">Automobile</option>
                <option value="Electrical">Electrical</option>
                <option value="AC Repair">AC Repair</option>
                <option value="ICT & Network">ICT & Network</option>
                <option value="Plumbing">Plumbing</option>
            </select>
            <button class="btn btn-primary" onclick="saveProfile()" id="saveBtn">Save & Broadcast Location</button>
        </div>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Firebase Configuration using your credentials
    const firebaseConfig = {
        apiKey: "AIzaSyAhCnSWjRWP3jKVrYdyZm8ArlUcSsLDbwA",
        authDomain: "mm-omni-hub.firebaseapp.com",
        projectId: "mm-omni-hub",
        storageBucket: "mm-omni-hub.firebasestorage.app",
        messagingSenderId: "503933600312",
        appId: "1:503933600312:web:10cefeb7c7868c395b9ccd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let isLogin = true;

    // Navigation logic
    window.showView = (view) => {
        ['view-customer', 'view-auth', 'view-dashboard'].forEach(id => document.getElementById(id).classList.add('hidden'));
        document.getElementById('view-' + view).classList.remove('hidden');
    };

    window.toggleAuth = () => {
        isLogin = !isLogin;
        document.getElementById('authTitle').innerText = isLogin ? "Technician Login" : "Technician Registration";
        document.getElementById('authBtn').innerText = isLogin ? "Login" : "Register Now";
        document.getElementById('toggleText').innerText = isLogin ? "Don't have an account? Register here" : "Already have an account? Login here";
    };

    // Authentication logic
    window.handleAuth = async () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        if(!email || !pass) return alert("Please fill all fields.");
        
        try {
            if(isLogin) await signInWithEmailAndPassword(auth, email, pass);
            else await createUserWithEmailAndPassword(auth, email, pass);
        } catch (e) { alert(e.message); }
    };

    window.handleLogout = () => signOut(auth);

    // Monitor Auth State
    onAuthStateChanged(auth, async (user) => {
        const navBtns = document.getElementById('navButtons');
        if (user) {
            navBtns.innerHTML = `<button class="btn btn-outline" onclick="showView('dashboard')">Dashboard</button>`;
            showView('dashboard');
            
            // Load existing profile data
            const docSnap = await getDoc(doc(db, "technicians", user.uid));
            if(docSnap.exists()){
                const data = docSnap.data();
                document.getElementById('dbName').value = data.name || "";
                document.getElementById('dbPhone').value = data.phone || "";
                document.getElementById('dbCat').value = data.category || "Automobile";
            }
        } else {
            navBtns.innerHTML = `<button class="btn btn-outline" onclick="showView('auth')">Technician Login</button>`;
            showView('customer');
        }
    });

    // Profile update logic
    window.saveProfile = () => {
        const user = auth.currentUser;
        if(!user) return;

        const btn = document.getElementById('saveBtn');
        btn.innerText = "Accessing GPS..."; btn.disabled = true;

        navigator.geolocation.getCurrentPosition(async (pos) => {
            try {
                await setDoc(doc(db, "technicians", user.uid), {
                    name: document.getElementById('dbName').value,
                    phone: document.getElementById('dbPhone').value,
                    category: document.getElementById('dbCat').value,
                    lat: pos.coords.latitude,
                    lng: pos.coords.longitude,
                    uid: user.uid,
                    timestamp: new Date()
                }, { merge: true });
                alert("Profile and Location updated successfully!");
            } catch (e) { alert(e.message); }
            btn.innerText = "Save & Broadcast Location"; btn.disabled = false;
        }, (err) => {
            alert("Please allow location access to be visible to customers.");
            btn.disabled = false;
        });
    };

    // Real-time directory sync
    onSnapshot(collection(db, "technicians"), (snap) => {
        const list = document.getElementById('techList');
        if(snap.empty) {
            list.innerHTML = "<p>No active specialists found at the moment.</p>";
            return;
        }
        list.innerHTML = snap.docs.map(doc => {
            const t = doc.data();
            return `
                <div class="card">
                    <span class="badge">● Online</span>
                    <h3 style="margin: 5px 0;">${t.name || 'Anonymous'}</h3>
                    <p style="color:var(--primary); font-weight:bold; margin-bottom:15px;">${t.category}</p>
                    <a href="tel:${t.phone}" class="btn btn-success"><i class="fas fa-phone-alt"></i> Call Specialist</a>
                </div>`;
        }).join('');
    });
</script>

</body>
</html>
